<div class="product-card">
  <div class="card-header">
    <h2>{%PRODUCTNAME%}</h2>
    <p class="price">&#8369;{%PRICE%}</p>
    <p class="category">{%CATEGORY%}</p>
  </div>
  <div class="card-body">
    <p>{%DESCRIPTION%}</p>
  </div>
  <div class="card-footer">
    <a href="/item?id={%ID%}" class="btn btn-view-details btn-wide">View</a>
    <button class="btn btn-update btn-wide" onclick="alert('Update functionality is not yet implemented!')">Update</button>
    <button class="btn btn-delete btn-wide" onclick="alert('Delete functionality is not yet implemented!')">Delete</button>
  </div>
</div>
